# literal <html> marker - that is how Swing decides to parse it as markup.
# Without it the text is plain and newlines collapse, so paragraphs and lists
# will not render. See the Modules API "Writing the manifest" section.
OpenIDE-Module-Name=AI Coder for NetBeans
OpenIDE-Module-Short-Description=AI coding assistants inside NetBeans: Claude, Codex, GitHub Copilot, Grok, OpenCode, Pi or Ollama (Local).
OpenIDE-Module-Long-Description=<html><p>AI Coder runs interactive AI coding sessions inside NetBeans, alone or as a team of AI sessions that work with you and with each other.</p><p>Supported backends: Claude, Codex, GitHub Copilot, Grok, OpenCode, Pi and Ollama (Local).</p><p><b>Features:</b></p><ul><li>Built-in MCP server exposing IDE-aware tools, with a diff panel to accept or reject each file change.<li>IDE refactoring, search, build and test, Git, and Run/Debug Project tools for the AI.<li>Several sessions open at once, each with its own project, chat history and settings.<li>Session instructions and configuration templates, with built-in Coordinator, Coder and Reviewer roles.<li>Per-session permissions for web, database, Git and messaging access.<li>Works from live IDE state, including unsaved editor changes and compiler diagnostics.<li>Thinking or reasoning-effort control on backends that support it, offering only the levels the selected model accepts.<li>Builds and tests run through a shared queue, with an optional async mode that reports back when finished.<li>Built-in messaging between AI sessions, with idle notifications when a peer session stops.<li>See the GitHub page for full help for this version.</ul>
OpenIDE-Module-Display-Category=Tools

