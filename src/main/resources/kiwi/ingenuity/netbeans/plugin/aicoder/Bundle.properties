# literal <html> marker - that is how Swing decides to parse it as markup.
# Without it the text is plain and newlines collapse, so paragraphs and lists
# will not render. See the Modules API "Writing the manifest" section.
OpenIDE-Module-Name=AI Coder for NetBeans
OpenIDE-Module-Short-Description=AI coding assistants inside NetBeans: Claude, Codex, GitHub Copilot, Grok, OpenCode, pi or Ollama (Local).
OpenIDE-Module-Long-Description=<html><p>AI Coder provides interactive AI sessions for assisting your coding needs.</p><p>Claude, Codex, GitHub Copilot, Grok, OpenCode, pi and Ollama (Local) are currently implemented AI agents.</p><p><b>Features:</b></p><ul><li>Built in MCP server for NetBeans tool integration, and a diff panel to accept or reject specific file changes.<li>Several sessions open at once, each with its own project, chat history and settings.<li>Special instructions can be injected into a session, with reusable saved templates.<li>Per session permissions for web access, database access and messaging, with reusable configuration templates covering permissions, history and session options.<li>Works from live IDE state, including unsaved editor changes and compiler diagnostics for open files.<li>Thinking or reasoning-effort control on the backends that support it, offering only the levels the selected model accepts.<li>Builds and tests run through a shared queue, with an optional async mode that reports the result back when it finishes.<li>Inbuilt messaging system so AI sessions can communicate if enabled for a session, including notifications when a peer session goes idle.<li>See the GitHub page for full help for this version.</ul>
OpenIDE-Module-Display-Category=Tools

